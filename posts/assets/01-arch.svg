<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#ffffff"/>
  <text x="40" y="34" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">LLMClient 数据流（OpenAI 兼容层）</text>
  <text x="40" y="54" font-family="sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">一套接口通吃 OpenAI / DeepSeek / 通义 / OpenRouter</text>

  <rect x="40" y="90" width="150" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="115" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">调用方</text>
  <text x="115" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#185FA5">demo / Agent 内核</text>
  <text x="115" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#185FA5">chat() · chatStream()</text>

  <rect x="270" y="78" width="170" height="160" rx="10" fill="#85B7EB" stroke="#185FA5" stroke-width="1"/>
  <text x="355" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#042C53">LLMClient</text>
  <text x="355" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">构造请求体</text>
  <text x="355" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">{ model, messages, stream }</text>
  <text x="355" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">rawCompletions()</text>
  <text x="355" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">SSE 增量解析</text>
  <text x="355" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">错误 → 友好抛出</text>
  <text x="355" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0C447C">(零运行时依赖)</text>

  <rect x="510" y="90" width="150" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="585" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">模型端点</text>
  <text x="585" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">OpenAI-compatible</text>
  <text x="585" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">POST /chat/completions</text>

  <line x1="190" y1="130" x2="268" y2="130" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="229" y="122" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">messages+opt</text>
  <line x1="440" y1="118" x2="508" y2="118" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="474" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">POST JSON</text>
  <line x1="508" y1="150" x2="440" y2="150" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="474" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">响应 / SSE</text>
  <line x1="270" y1="170" x2="192" y2="170" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="231" y="188" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">content / delta</text>

  <rect x="40" y="380" width="620" height="72" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="56" y="404" font-family="sans-serif" font-size="12" font-weight="500" fill="#444441">非流式 chat()：一次解析 choices[0].message.content</text>
  <text x="56" y="424" font-family="sans-serif" font-size="12" font-weight="400" fill="#444441">流式 chatStream()：逐 data: 行提取 delta.content，遇 [DONE] 结束</text>
  <text x="56" y="442" font-family="sans-serif" font-size="12" font-weight="400" fill="#444441">非 2xx：抛出「LLMClient.xxx failed: 状态码 响应体」</text>
</svg>
